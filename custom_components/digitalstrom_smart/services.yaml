call_scene:
  name: Call Scene
  description: Activate a Digital Strom scene in a zone.
  fields:
    zone_id:
      name: Zone ID
      description: The zone ID.
      required: true
      selector:
        number:
          min: 1
          max: 65533
          mode: box
    group:
      name: Group
      description: Device group (1=Light, 2=Shade, 3=Heating, 8=Joker).
      default: 1
      selector:
        number:
          min: 0
          max: 64
          mode: box
    scene_number:
      name: Scene Number
      description: Scene number (0=Off, 5=Scene1, 17=Scene2, 18=Scene3, 19=Scene4).
      required: true
      selector:
        number:
          min: 0
          max: 127
          mode: box
    force:
      name: Force (local priority override)
      description: >-
        Override local priority. A device switched on by its physical wall
        button ignores plain zone scene calls; enable this to force the scene
        through (e.g. to reliably switch a zone off from an automation).
        Default false keeps standard behaviour.
      default: false
      selector:
        boolean:

blink_device:
  name: Blink Device
  description: Make a device blink for identification. Requires Pro license.
  fields:
    dsuid:
      name: Device dSUID
      description: The unique ID of the device to blink.
      required: true
      selector:
        text:

save_scene:
  name: Save Scene
  description: Save current output values as a scene. Requires Pro license.
  fields:
    zone_id:
      name: Zone ID
      description: The zone ID.
      required: true
      selector:
        number:
          min: 1
          max: 65533
          mode: box
    group:
      name: Group
      description: Device group.
      default: 1
      selector:
        number:
          min: 0
          max: 64
          mode: box
    scene_number:
      name: Scene Number
      description: Scene number to save to.
      required: true
      selector:
        number:
          min: 0
          max: 127
          mode: box

setup_apple_home:
  name: Set up Apple Home (Pro)
  description: >-
    Creates one HomeKit Bridge with only the useful Digital Strom entities for
    the Apple Home app: one light per room (on/off/dim), the mood switches
    (named scenes that stay on while active) and the room thermostats. Run it
    again after adding rooms or scenes; the same bridge is updated, no new
    pairing. The first run shows the pairing QR code as a notification.
  fields:
    include_moods:
      name: Mood switches
      description: Add the named scenes per room as switches.
      default: true
      selector:
        boolean:
    include_thermostats:
      name: Thermostats
      description: Add the room thermostats.
      default: true
      selector:
        boolean:
